name: Quality gates
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  http-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dependency-free HTTP boundary tests
        run: node --experimental-strip-types --test scripts/api-http.test.mjs
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.33.2
      - run: pnpm install --frozen-lockfile
      - name: Inspect installed framework route guide
        shell: bash
        run: |
          if [ -d node_modules/next/dist/docs ]; then
            GUIDE=$(find node_modules/next/dist/docs -type f \( -name 'route.md' -o -name 'route.mdx' \) | head -n 1)
            if [ -n "$GUIDE" ]; then sed -n '1,160p' "$GUIDE"; fi
          fi
      - run: pnpm typecheck
      - run: pnpm test:demo
      - run: pnpm build
      # Do not invoke `pnpm test` here: the legacy script writes to a real DB
      # and queues paid/live inference. Use dedicated staging accounts for E2E.
