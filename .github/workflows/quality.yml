name: Production quality gates
on:
  pull_request:
  push:
    branches: [main, develop, hardening/learning-runtime-v2]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@10.33.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:demo
      - run: pnpm typecheck:foundation
      - run: pnpm typecheck
      - run: node --check scripts/learning-worker.mjs
      - run: pnpm build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r scripts/browser/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/browser/learning.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: science_sos_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d science_sos_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/science_sos_test
      ALLOW_DISPOSABLE_DATABASE: 'yes'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Real PostgreSQL contracts and concurrent workers
        run: bash scripts/db/run.sh
      - name: Dump and restore disposable database
        run: |
          docker exec ${{ job.services.postgres.id }} pg_dump -U postgres -Fc science_sos_test > /tmp/learning.dump
          docker exec ${{ job.services.postgres.id }} createdb -U postgres science_sos_restore_test
          docker exec -i ${{ job.services.postgres.id }} pg_restore -U postgres --exit-on-error --no-owner -d science_sos_restore_test < /tmp/learning.dump
          psql postgresql://postgres:postgres@localhost:5432/science_sos_restore_test -X -v ON_ERROR_STOP=1 -f scripts/db/learning.sql
